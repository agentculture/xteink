name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Promote SONAR_TOKEN to job env so the SonarCloud step can gate on
    # `env.SONAR_TOKEN != ''` — `secrets.*` isn't allowed in `if:`. This
    # makes the step a no-op on fork PRs (where the secret isn't injected)
    # and on any repo that hasn't configured the token yet.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Sonar needs full git history for accurate "new code" blame attribution.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      # Fast proof that the base CLI works with NO extras (the runtime package has zero
      # dependencies by design): the server/mcp suites must not be needed for `xteink` itself.
      - name: base install (no extras) CLI smoke
        run: |
          uv sync
          uv run pytest tests/cli tests/test_cli.py -q -p no:cacheprovider

      # Full suite WITH the server extra. A plain `uv sync` has no fastapi/mcp, so every
      # tests/server + tests/mcp test and the api/openapi.json drift check
      # (tests/server/test_app_openapi.py) used to be silently SKIPPED here (risk r10).
      - name: install with server extra
        run: uv sync --extra server

      - name: no server/mcp test may skip
        run: |
          set -o pipefail
          uv run pytest tests/server tests/mcp -q -rs -p no:cacheprovider -n auto 2>&1 | tee /tmp/server-tests.txt
          if grep -Eq "SKIPPED|[0-9]+ skipped" /tmp/server-tests.txt; then
            echo "::error::server/mcp tests were skipped; the OpenAPI drift check must run in CI"
            exit 1
          fi

      - run: uv run pytest -n auto --cov=xteink --cov-report=xml:coverage.xml --cov-report=term -v

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: scan for committed secrets and non-localhost endpoints
        run: python3 scripts/scan-secrets.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      - name: black --check
        run: uv run black --check xteink tests

      - name: isort --check
        run: uv run isort --check-only xteink tests

      - name: flake8
        run: uv run flake8 xteink tests

      - name: bandit
        run: uv run bandit -c pyproject.toml -r xteink

      - name: markdownlint-cli2
        run: |
          npm install -g markdownlint-cli2@0.21.0
          markdownlint-cli2 "**/*.md" "#node_modules" "#.local" "#.claude/skills" "#.teken"

      - name: afi rubric gate
        run: uv run teken cli doctor . --strict

  harness-smoke:
    # All four harnesses (Claude Code, Pi/associate, colleague, Qwen Code) are
    # live for interactive use over the same clone at all times, so all four
    # configs must be correct at all times. Nothing else in CI checks more than
    # the one config `culture.yaml`'s declared backend uses.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      # `--stage all` runs three stages and prints exactly which of them really
      # ran here:
      #   config    — always runs; the load-bearing per-harness check.
      #   toolchain — steward doctor + four `guild create` dry-runs, fetched
      #               from PyPI with uvx.
      #   live      — the four documented harness invocations. A stock runner
      #               ships none of those CLIs, so this stage SKIPS and says so
      #               under "NOT VERIFIED"; it is never counted as a pass.
      # `--require config` makes a skipped config stage a hard failure.
      #
      # The script writes results to stdout and diagnostics (the NOT VERIFIED
      # and WAIVED expansions, and any failure detail) to stderr, per the
      # repo's CLI contract. Both are folded into the step summary with `2>&1`
      # so the run's honesty about what it did NOT verify stays visible there.
      - name: per-harness smoke check
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/harness-smoke.py --stage all --require config 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # --- path filtering -------------------------------------------------------------------
  # Decides which of the heavier jobs (web, image, privacy) a PR needs, so Python-only PRs
  # stay fast. Plain git diff instead of a third-party action. On push to main every job
  # runs. Skipped jobs report "skipped", which branch protection treats as passing.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      image: ${{ steps.filter.outputs.image }}
      privacy: ${{ steps.filter.outputs.privacy }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            printf 'web=true\nimage=true\nprivacy=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "changed files:"; echo "$FILES"
          match() { if echo "$FILES" | grep -Eq "$1"; then echo true; else echo false; fi; }
          # web: the UI itself plus whatever its Playwright run exercises (server + stack).
          WEB="$(match '^(web/|xteink/server/|Dockerfile$|compose\.yaml$|\.github/workflows/tests\.yml$)')"
          # image: anything baked into the Docker image.
          IMAGE="$(match '^(Dockerfile$|compose\.yaml$|docker/|pyproject\.toml$|uv\.lock$|xteink/|web/|\.github/workflows/tests\.yml$)')"
          # privacy: the image, plus the tests it runs and its own harness.
          PRIVACY="$(match '^(Dockerfile$|compose\.yaml$|docker/|pyproject\.toml$|uv\.lock$|xteink/|web/|tests/|api/|\.github/(workflows/tests\.yml|scripts/privacy|compose\.privacy\.yaml))')"
          echo "web=$WEB image=$IMAGE privacy=$PRIVACY"
          { echo "web=$WEB"; echo "image=$IMAGE"; echo "privacy=$PRIVACY"; } >> "$GITHUB_OUTPUT"

  web:
    # web/ unit tests + production build + Playwright e2e against a throwaway compose stack.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: xteink-e2e
      XTEINK_IMAGE: xteink-e2e:local
      XTEINK_PUBLISH_BIND: 127.0.0.1
      XTEINK_PUBLISH_PORT: "18780"
      XTEINK_PUBLISH_DEVICE_PORT: "18781"
      XTEINK_PUBLISH_MCP_PORT: "18782"
      XTEINK_E2E_URL: http://127.0.0.1:18780
      XTEINK_E2E_DEVICE_URL: http://127.0.0.1:18781
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: vitest
        working-directory: web
        run: npm test

      - name: build
        working-directory: web
        run: npm run build

      - name: install Playwright chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: start the throwaway stack (api only; no tunnel profile)
        run: |
          docker compose up -d --build --wait api

      - name: Playwright e2e
        working-directory: web
        run: |
          KEY="$(docker compose exec -T api python -m xteink.server create-key e2e 2>/dev/null)"
          echo "::add-mask::$KEY"
          export XTEINK_E2E_KEY="$KEY"
          npx playwright test

      - name: stack logs on failure
        if: failure()
        run: docker compose logs --no-color api | tail -200

      - name: tear down
        if: always()
        run: docker compose down -v --remove-orphans --rmi local

  image:
    # Build the server image for linux/arm64 (the reader-adjacent target, e.g. a Jetson or
    # Raspberry Pi). A native arm64 runner is used instead of QEMU: emulated builds of the
    # node + pip + pandoc stages are slow and flaky, and a native build also proves the
    # pinned arm64 pandoc checksum and binary really work on arm64.
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: xteink:ci-arm64
          cache-from: type=gha,scope=image-arm64
          cache-to: type=gha,scope=image-arm64,mode=max

      - name: smoke the arm64 image
        run: |
          docker run --rm xteink:ci-arm64 uname -m
          docker run --rm xteink:ci-arm64 pandoc --version | head -1
          docker run --rm xteink:ci-arm64 python -c "import xteink.server.app, xteink.mcp; print('imports ok')"

  privacy:
    # c51/h25: with the tunnel profile off, the stack makes ZERO outbound connections. The
    # api runs on a docker network created `internal: true` (no gateway), the core/server/mcp
    # tests run from a container on that same network, and a fake device syncs against it.
    # Anything that tried the internet would fail. See .github/scripts/privacy-check.sh.
    needs: changes
    if: needs.changes.outputs.privacy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: internal-network privacy check
        run: .github/scripts/privacy-check.sh

  version-check:
    # Only run on PR events. On push to main after a merged PR, the comparison
    # would always fail (PR_VERSION == MAIN_VERSION because HEAD and origin/main
    # point at the same commit). Restricting the trigger avoids that.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - run: git fetch origin main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check version bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # AgentCulture rule: every PR bumps the version — even docs/config/CI.
          # See CLAUDE.md and the version-bump skill for rationale.
          PR_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          MAIN_VERSION=$(git show origin/main:pyproject.toml 2>/dev/null | python3 -c "import sys,tomllib; print(tomllib.loads(sys.stdin.read())['project']['version'])" 2>/dev/null || echo "")

          if [ -z "$MAIN_VERSION" ]; then
            echo "No pyproject.toml on main yet — skipping version check (initial scaffold)."
            exit 0
          fi

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            MARKER="<!-- version-check -->"
            BODY="⚠️ **Version not bumped** — \`pyproject.toml\` still has \`$PR_VERSION\` (same as main). Bump before merging to avoid a failed PyPI publish.

          $MARKER"

            EXISTING=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              --jq '.[] | select(.body | contains("<!-- version-check -->")) | .id' | head -1)

            if [ -n "$EXISTING" ]; then
              gh api repos/${{ github.repository }}/issues/comments/$EXISTING \
                -X PATCH -f body="$BODY" > /dev/null
            else
              gh pr comment ${{ github.event.pull_request.number }} --body "$BODY" || true
            fi

            echo "::error::Version $PR_VERSION matches main. Bump before merging."
            exit 1
          else
            echo "Version bumped: $MAIN_VERSION -> $PR_VERSION"
          fi
